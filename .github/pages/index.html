<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=yes" />
    <style>
      html {
        font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #fff;
        font-size: 16px;
      }
      body {
        color: #4a4a4a;
        margin: 8px;
        font-size: 1em;
        font-weight: 400;
      }
      header {
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
      }
      main {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      a {
        color: #3273dc;
        cursor: pointer;
        text-decoration: none;
      }
      a:hover {
        color: #000;
      }
      button {
        color: #fff;
        background-color: #3298dc;
        border-color: transparent;
        cursor: pointer;
        text-align: center;
      }
      button:hover {
        background-color: #2793da;
        flex: none;
      }
      .spacer {
        flex: auto;
      }
      .small {
        font-size: 0.75rem;
      }
      footer {
        margin-top: 16px;
        display: flex;
        align-items: center;
      }
      .header-label {
        margin-right: 4px;
      }
      .benchmark-set {
        margin: 8px 0;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .benchmark-title {
        font-size: 3rem;
        font-weight: 600;
        word-break: break-word;
        text-align: center;
      }
      .benchmark-graphs {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        width: 100%;
      }
      .benchmark-chart {
        max-width: 1000px;
      }
      .group-title {
        font-size: 1.5rem;
        font-weight: 600;
        text-align: center;
        margin: 16px 0 4px;
      }
    </style>
    <title>Benchmarks</title>
  </head>

  <body>
    <header id="header">
      <div class="header-item">
        <strong class="header-label">Last Update:</strong>
        <span id="last-update"></span>
      </div>
      <div class="header-item">
        <strong class="header-label">Repository:</strong>
        <a id="repository-link" rel="noopener"></a>
      </div>
    </header>
    <main id="main"></main>
    <footer>
      <button id="dl-button">Download data as JSON</button>
      <div class="spacer"></div>
      <div class="small">Powered by <a rel="noopener" href="https://github.com/marketplace/actions/continuous-benchmark">github-action-benchmark</a></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.2/dist/Chart.min.js"></script>
    <script src="data.js"></script>
    <script>
      'use strict';
      (function() {
        const palette = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#008080', '#9a6324', '#800000', '#808000', '#000075'];
        const data = window.BENCHMARK_DATA;

        document.getElementById('last-update').textContent = new Date(data.lastUpdate).toString();
        const repoLink = document.getElementById('repository-link');
        repoLink.href = data.repoUrl;
        repoLink.textContent = data.repoUrl;
        document.getElementById('dl-button').onclick = () => {
          const a = document.createElement('a');
          a.href = 'data:,' + encodeURIComponent(JSON.stringify(data, null, 2));
          a.download = 'benchmark_data.json';
          a.click();
        };

        // "jvm-channel: mock round trip" -> group "jvm-channel", series "mock round trip"
        // "org.x.FooBenchmark.channelArrayAccess" -> series "FooBenchmark.channelArrayAccess",
        // grouped by the part after the first camelCase word ("ArrayAccess") when at least
        // two benchmarks share it, otherwise by the class.
        function parse(name) {
          const colon = name.indexOf(': ');
          if (colon > 0) {
            return { group: name.slice(0, colon), series: name.slice(colon + 2), workload: null };
          }
          const parts = name.split('.');
          const method = parts.pop();
          const cls = parts.pop() || '';
          const m = /^[a-z]+([A-Z].*)$/.exec(method);
          return { group: cls, series: cls ? cls + '.' + method : method, workload: m ? m[1] : null };
        }

        function groupBenches(entries) {
          const infos = new Map();
          for (const e of entries) {
            for (const b of e.benches) {
              if (!infos.has(b.name)) {
                infos.set(b.name, Object.assign(parse(b.name), { unit: b.unit }));
              }
            }
          }
          const workloadCount = new Map();
          for (const i of infos.values()) {
            if (i.workload) workloadCount.set(i.workload, (workloadCount.get(i.workload) || 0) + 1);
          }
          const groups = new Map();
          for (const [name, i] of infos) {
            const title = i.workload && workloadCount.get(i.workload) > 1 ? i.workload : i.group;
            const key = title + ' [' + i.unit + ']';
            if (!groups.has(key)) groups.set(key, { title: key, unit: i.unit, series: [] });
            groups.get(key).series.push({ name, label: i.series });
          }
          return [...groups.values()];
        }

        function renderChart(parent, group, entries) {
          const canvas = document.createElement('canvas');
          canvas.className = 'benchmark-chart';
          parent.appendChild(canvas);
          const datasets = group.series.map((s, idx) => {
            const color = palette[idx % palette.length];
            return {
              label: s.label,
              data: entries.map(e => {
                const b = e.benches.find(x => x.name === s.name);
                return b ? b.value : null;
              }),
              borderColor: color,
              backgroundColor: color + '60',
              fill: false,
              spanGaps: true,
            };
          });
          new Chart(canvas, {
            type: 'line',
            data: { labels: entries.map(e => e.commit.id.slice(0, 7)), datasets },
            options: {
              scales: {
                xAxes: [{ scaleLabel: { display: true, labelString: 'commit' } }],
                yAxes: [{ scaleLabel: { display: true, labelString: group.unit }, ticks: { beginAtZero: true } }],
              },
              tooltips: {
                callbacks: {
                  afterTitle: items => {
                    const c = entries[items[0].index].commit;
                    return '\n' + c.message + '\n\n' + c.timestamp + ' committed by @' + c.committer.username + '\n';
                  },
                  label: item => datasets[item.datasetIndex].label + ': ' + item.value + ' ' + group.unit,
                },
              },
              onClick: (_ev, active) => {
                if (active.length) window.open(entries[active[0]._index].commit.url, '_blank');
              },
            },
          });
        }

        const main = document.getElementById('main');
        for (const name of Object.keys(data.entries)) {
          const entries = data.entries[name];
          const setElem = document.createElement('div');
          setElem.className = 'benchmark-set';
          main.appendChild(setElem);
          const h = document.createElement('h1');
          h.className = 'benchmark-title';
          h.textContent = name;
          setElem.appendChild(h);
          for (const group of groupBenches(entries)) {
            const t = document.createElement('div');
            t.className = 'group-title';
            t.textContent = group.title;
            setElem.appendChild(t);
            const graphs = document.createElement('div');
            graphs.className = 'benchmark-graphs';
            setElem.appendChild(graphs);
            renderChart(graphs, group, entries);
          }
        }
      })();
    </script>
  </body>
</html>
