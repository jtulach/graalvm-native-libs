name: Benchmarks

on:
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  pr-benchmarks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1.6.2
      with:
        version: '25.1'
        distribution: 'graalvm'
        cache: maven

    - name: Build (no native-image - that's the slow part this cadence keeps off PRs)
      run: mvn -B install -DskipTests --file pom.xml

    - name: jvm-channel mock/hotspot ratios
      run: java .github/scripts/BenchAggregate.java . channel-aggregate.json --no-native

    - name: jvm-interop JMH (reduced)
      run: java -jar bench/interop/target/bench-interop.jar -wi 2 -i 3 -f 1 -rf json -rff bench/interop/target/jmh-result.json

    - name: persist JMH (reduced)
      run: java -jar bench/persist/target/bench-persist.jar -wi 2 -i 3 -f 1 -rf json -rff bench/persist/target/jmh-result.json

    - name: Compare jvm-channel ratios against baseline
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: 'jvm-channel ratios'
        tool: 'customSmallerIsBetter'
        output-file-path: channel-aggregate.json
        benchmark-data-dir-path: dev/bench/channel-ratios
        gh-pages-branch: gh-pages
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false
        alert-threshold: '150%'
        comment-on-alert: true
        fail-on-alert: true

    - name: Compare jvm-interop JMH against baseline
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: 'jvm-interop JMH'
        tool: 'jmh'
        output-file-path: bench/interop/target/jmh-result.json
        benchmark-data-dir-path: dev/bench/interop-jmh
        gh-pages-branch: gh-pages
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false
        alert-threshold: '150%'
        comment-on-alert: true
        fail-on-alert: true

    - name: Compare persist JMH against baseline
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: 'persist JMH'
        tool: 'jmh'
        output-file-path: bench/persist/target/jmh-result.json
        benchmark-data-dir-path: dev/bench/persist-jmh
        gh-pages-branch: gh-pages
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false
        alert-threshold: '150%'
        comment-on-alert: true
        fail-on-alert: true

  full-benchmarks:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1.6.2
      with:
        version: '25.1'
        distribution: 'graalvm'
        cache: maven

    - name: Build
      run: mvn -B install --file pom.xml

    - name: Build native-image executables (bench/channel + the examples, for size tracking)
      run: mvn -Pnative -B package --file pom.xml

    - name: jvm-interop JMH (full)
      run: java -jar bench/interop/target/bench-interop.jar -rf json -rff bench/interop/target/jmh-result.json

    - name: persist JMH (full)
      run: java -jar bench/persist/target/bench-persist.jar -rf json -rff bench/persist/target/jmh-result.json

    - name: jvm-channel ratios + native-image sizes
      run: java .github/scripts/BenchAggregate.java . channel-aggregate.json

    - name: Publish jvm-channel ratios
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: 'jvm-channel ratios'
        tool: 'customSmallerIsBetter'
        output-file-path: channel-aggregate.json
        benchmark-data-dir-path: dev/bench/channel-ratios
        gh-pages-branch: gh-pages
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        alert-threshold: '150%'
        comment-on-alert: true
        fail-on-alert: false

    - name: Publish jvm-interop JMH
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: 'jvm-interop JMH'
        tool: 'jmh'
        output-file-path: bench/interop/target/jmh-result.json
        benchmark-data-dir-path: dev/bench/interop-jmh
        gh-pages-branch: gh-pages
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        alert-threshold: '150%'
        comment-on-alert: true
        fail-on-alert: false

    - name: Publish persist JMH
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: 'persist JMH'
        tool: 'jmh'
        output-file-path: bench/persist/target/jmh-result.json
        benchmark-data-dir-path: dev/bench/persist-jmh
        gh-pages-branch: gh-pages
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        alert-threshold: '150%'
        comment-on-alert: true
        fail-on-alert: false
